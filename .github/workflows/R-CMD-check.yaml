# R CMD check on three operating systems with release R, once on Ubuntu
# with only the hard dependencies installed, and the tests from the source
# tree once on Ubuntu.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  hard-dependencies-only:
    # Plain R CMD build and check: rcmdcheck would install packages that
    # detfield does not depend on, such as callr and pkgbuild. Vignettes are
    # skipped because knitr is a Suggests.
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, hard dependencies only)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Build and check with the hard dependencies only
        shell: bash
        run: |
          R CMD build --no-build-vignettes --no-manual .
          R CMD check --no-manual --ignore-vignettes detfield_*.tar.gz
          grep '^Status:' detfield.Rcheck/00check.log
          ! grep -Eq '^Status:.*(ERROR|WARNING)' detfield.Rcheck/00check.log

  test-local:
    # testthat::test_local() runs the tests from the source tree, so tests that
    # read README.Rmd, vignettes/ or data-raw/ run; R CMD check skips them,
    # because the built package does not hold those files.
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, test_local)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check
      - name: Run the tests from the source tree
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
